<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Computer-vision robotic hand cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050812"/>
      <stop offset=".55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="28%" cy="22%" r="70%">
      <stop stop-color="#54d7e8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#54d7e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="80%" cy="70%" r="60%">
      <stop stop-color="#9b7cff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#cyanGlow)"/>
  <rect width="1200" height="675" fill="url(#violetGlow)"/>

