<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Instagram Highlight Toolkit launcher thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050505"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="18%" r="85%">
      <stop stop-color="#54d7e8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#54d7e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="48" width="1116" height="579" rx="14" fill="#020202" stroke="#58e6ff" stroke-width="2.5"/>
    <rect x="42" y="48" width="1116" height="33" rx="14" fill="#070707"/>
    <path d="M42 81h1116" stroke="#222"/>
    <text x="63" y="70" fill="#f5f5f5" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="15" font-weight="700">▣ Instagram Highlight Toolkit - Easy Launcher</text>
    <text x="1090" y="70" fill="#f5f5f5" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="19">─</text>
    <text x="1128" y="70" fill="#f5f5f5" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="18">□</text>
    <text x="1160" y="70" fill="#f5f5f5" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="18">×</text>
    <rect x="1141" y="88" width="12" height="520" rx="6" fill="#252525"/>
    <rect x="1141" y="101" width="12" height="42" rx="6" fill="#666"/>
    <g font-family="Consolas, 'IBM Plex Mono', monospace" fill="#f5f5f5" font-size="16.5">
      <text x="56" y="111">==============================================================</text>
      <text x="56" y="134">Instagram Highlight Personal Archiver - Easy Launcher</text>
      <text x="56" y="157">==============================================================</text>
      <text x="56" y="196">This menu runs the existing Python tools for you.</text>
      <text x="56" y="219">Login stays manual. Use only content you own or have permission to handle.</text>
      <text x="56" y="258">1. Setup / update dependencies</text>
      <text x="56" y="282">2. Archive highlights from the current Instagram profile</text>
      <text x="56" y="306">3. Archive highlights from a username or profile URL</text>
      <text x="56" y="330">4. Restore: calibrate EasyLoad/Insta Uploader buttons</text>
      <text x="56" y="354">5. Restore: choose folder and preview order only</text>
      <text x="56" y="378">6. Restore: choose folder and run</text>
      <text x="56" y="402">7. Restore: resume from a specific item</text>
      <text x="56" y="426">8. Open the easy run guide</text>
      <text x="56" y="450">9. Open dedicated Chrome login profile folder</text>
      <text x="56" y="474">10. Reset dedicated Chrome login profile</text>
      <text x="56" y="498">11. Open login-only Chrome (no automation)</text>
      <text x="56" y="522">0. Exit</text>
      <text x="56" y="560">Choose an option:</text>
    </g>
  </g>
</svg>